<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <style>
    
    #quadrado {
      margin: 0 auto;
      margin-top: 100px;
      background-color: #fff;
      width: 400px;
      height: 400px;
      border: 2px solid #gray;
      box-shadow: -5px 5px 20px rgba(0,0,0,0.5);
      border-radius: 15px;
    }
    h1,h4 {
      font-family: "Momo Trust Display", sans-serif;
      font-weight: 400;
      text-align: center;
    }
    #nome,#numero,#email,#senha {
      width: 340px;
      height: 27px;
      border-radius: 10px;
      margin-bottom: 5px;
      border: 2px solid #6d6d6d;
    }
    #enviar {
      width: 300px;
      height: 27px;
      color: #fff;
      background-color: #050505;
      border-radius: 10px;
      border: none;
      font-family: "Momo Trust Display";
    }
    h1 {
      color: #000;
    }
  </style>
</head>
<body>
  <div id="quadrado">
    <h1>Registrar-se</h1>
    <form action="index.html" method="get" style="text-align: center;">
      <input type="text" id="nome" name="nome" placeholder="seu nome aqui" required>
      <input type="number" id="numero" name="numero" placeholder="seu telefone aqui" required>     
      <input type="email" id="email" name="email" placeholder="seu email aqui" required>
      <input type="password" id="senha" name="senha" placeholder="sua senha aqui" required>
      <input type="submit" id="enviar" value="Registrar">
    </form>
    <h4>Já tem uma conta?<br> 
      <a href="conta.html" style="text-decoration: none; color: #000;"><strong>Login</strong></a>
    </h4>
  </div>
</body>
</html>
