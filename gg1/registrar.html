<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Momo+Trust+Display&display=swap" rel="stylesheet">
        <style>
            body {
                background-image: linear-gradient(to right,#000000,rgb(59, 59, 59));
            }

            #quadrado {
                margin: 0px auto;
                margin-top: 100px;
                background-color: rgb(255, 255, 255);
                width: 400px;
                height: 400px;
                border: 2px solid rgb(83, 83, 83);
                box-shadow: -5px  5px  20px rgba(0, 0, 0, 0.5);
                border-radius: 15px;
            }

            h1,h4 {
                font-family: "Momo Trust Display", sans-serif;
                font-weight: 400;
                font-style: normal;
                text-align: center;
            }

            #nome,#numero,#email,#senha {
                width: 340px;
                height: 27px;
                border-radius: 10px;
                margin-bottom: 5px;
                border: 2px solid rgb(109, 109, 109);
            }

            #enviar{
                width: 300px;
                height: 27px;
                color: #ffffff;
                background-color: #050505;
                border-radius: 10px;
                border: 0px solid rgb(109, 109, 109);
                font-family: "Momo Trust Display";
            }

            h1{
                color: #000000;
            }
        </style>
    </head>
    <body>
        <div id="quadrado">
        <h1>Registrar-se</h1>
        <form action="" method="post" style="text-align: center;">
            <input type="text" id="nome" placeholder="seu nome aqui" required>
            <input type="number" id="numero" placeholder="seu telefone aqui" required>     
            <input type="email" id="email" placeholder="seu email aqui" required>
            <input type="password" id="senha" placeholder="sua senha aqui" required>
            <input type="submit" id="enviar" action="https://rafazzx.github.io/nike/">
        </form>
        <h4>ja tem uma conta?<br> <a href="conta.html" style="text-decoration: none; color: #000000;"><strong>Login</strong></a></h4>
    </div>
    </body>

</html
